name: Feature request
description: Suggest an improvement to the CLI, output or documentation.
labels: [ enhancement, triage ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include example commands or output if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - Yes, I can open a pull request
        - Maybe, with some guidance
        - No
    validations:
      required: true
